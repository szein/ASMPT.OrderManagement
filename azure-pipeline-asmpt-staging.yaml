trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

variables:
  buildConfiguration: 'Release'
  registry: ghcr.io
  rig-owner: szein

stages:
  # STAGE 1: Build & Test
  - stage: BuildAndTest
    displayName: 'Build and Test Applications'
    jobs:
      - job: BuildJob
        displayName: 'Build & Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # Setup .NET SDK
          - task: UseDotNet@2
            displayName: 'Use .NET SDK 8.x'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          # Restore
          - script: dotnet restore api/api.csproj
            workingDirectory: $(Build.SourcesDirectory)
            displayName: 'Restore Dependencies'

          # Build Projects
          - script: dotnet build api/api.csproj --no-restore --configuration $(buildConfiguration)
            workingDirectory: $(Build.SourcesDirectory)
            displayName: 'Build API and Web Projects'

          # Execute xUnit Tests
          - script: dotnet test xtest/api.Tests/api.Tests.csproj --configuration $(buildConfiguration) --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
            workingDirectory: $(Build.SourcesDirectory)
            displayName: 'Run xUnit Tests'

          # Publish test results inside Azure DevOps UI
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
              searchFolder: '$(Agent.TempDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: false

  # STAGE 2: Container Build (Pending / Disabled)
  - stage: ContainerBuild
    displayName: 'Build Container Image (Pending)'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: API
        pool:
          vmImage: ubuntu-latest
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'ghcr-connection'
            repository: '$(rig-owner)/api'
            command: 'buildAndPush'
            Dockerfile: 'api/Dockerfile'
            buildContext: '$(Build.SourcesDirectory)'
            tags: |
              asmpt-api
              latest

      - job: Web
        pool:
          vmImage: ubuntu-latest
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'ghcr-connection'
            repository: '$(rig-owner)/web'
            command: 'buildAndPush'
            Dockerfile: 'web/Dockerfile'
            buildContext: '$(Build.SourcesDirectory)'
            tags: |
              asmpt-web
              latest

  # STAGE 3: Deployment Section
  - stage: Deploy
    displayName: 'Deploy Application'
    dependsOn: BuildAndTest # Only runs if Build & Test stage succeeds
    condition: false # succeeded() when work is done
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Target Infrastructure'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Production' # environment
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Work in progress ..."
                  displayName: 'Deploy'