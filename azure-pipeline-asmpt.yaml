name: Build, Test, and Deploy Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Adjust to match your .NET version (e.g. 8.0, 10.0)

      # 3. Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 4. Build API and Web projects
      - name: Build Projects
        run: dotnet build --no-restore --configuration Release

      # 5. Execute API xUnit Tests
      - name: Run API xUnit Tests
        run: dotnet test ./xtest/api.Tests/api.Tests.csproj --configuration Release --no-build --verbosity normal

